# The whole app (R20, #13): `docker compose up -d --build`, then open http://localhost:8080.
# - db: Postgres 16; api: the Express API on :3000; web: the built SPA on :8080 (nginx, which
#   forwards /api to the api container).
# For development, run only db (and api), and `npm run dev -w @lm/web` on :5173 instead.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: app
    ports: ["5432:5432"]
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./apps/api/db-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d app"]
      interval: 2s
      retries: 30
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      DATABASE_URL: postgres://app:app@db:5432/app
      JWT_SECRET: ${JWT_SECRET:-compose-only-secret-not-for-production-use}
      PORT: "3000"
    ports: ["3000:3000"]
    depends_on:
      db:
        condition: service_healthy
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports: ["8080:80"]
    depends_on:
      api:
        condition: service_healthy
volumes:
  db-data:
