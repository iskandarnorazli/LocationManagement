# Local and e2e stack: Postgres and the API (R20). The web runs with `npm run dev -w apps/web`,
# which proxies /api to the API on port 3000.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: app
    ports: ["5432:5432"]
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./apps/api/db-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d app"]
      interval: 2s
      retries: 30
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      DATABASE_URL: postgres://app:app@db:5432/app
      JWT_SECRET: ${JWT_SECRET:-compose-only-secret-not-for-production-use}
      PORT: "3000"
    ports: ["3000:3000"]
    depends_on:
      db:
        condition: service_healthy
volumes:
  db-data:
