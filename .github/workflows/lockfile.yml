name: Update package-lock.json

# Decision D16 (as Awanfs decision 17): a session without network changes dependencies here.
# Run it on a branch whose package.json files changed. It resolves the lockfile on a GitHub
# runner and pushes it to that branch. A push by this workflow does not start CI; dispatch CI
# on the branch afterwards (ci.yml has workflow_dispatch).

on:
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch whose package.json changed (not main)"
        required: true

permissions:
  contents: write

jobs:
  lock:
    runs-on: ubuntu-latest
    steps:
      - name: Refuse main
        if: inputs.branch == 'main'
        run: |
          echo "Run this on a feature branch, then merge its PR." >&2
          exit 1
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.branch }}
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Resolve
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Show the change
        run: git diff --stat -- package-lock.json || true
      - name: Commit and push
        run: |
          if git diff --quiet -- package-lock.json && git ls-files --error-unmatch package-lock.json >/dev/null 2>&1; then echo "package-lock.json already up to date"; exit 0; fi
          git config user.name "Iskandar Norazli"
          git config user.email "111472977+iskandarnorazli@users.noreply.github.com"
          git add package-lock.json
          git commit -m "package-lock.json: resolve dependencies from package.json (lockfile workflow)"
          git push origin HEAD:${{ inputs.branch }}
