name: Bug
description: Something on screen or in the API does not do what it should.
labels: ["bug", "needs-triage"]
body:
  - type: input
    id: where
    attributes:
      label: Where
      description: The state or flow id from docs/UX_FLOWS.md (S3.markers, F5), or the endpoint.
      placeholder: "S4.success"
    validations: { required: true }
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      value: |
        1.
        2.
        3.
    validations: { required: true }
  - type: textarea
    id: expected
    attributes:
      label: Expected
      description: And the requirement (R) or decision (D) that says so, if you know it.
    validations: { required: true }
  - type: textarea
    id: actual
    attributes:
      label: Actual
    validations: { required: true }
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots
      description: Drag images here. An agent can add one with the "UI snapshots" workflow (Actions, Run workflow, this issue's number).
  - type: input
    id: env
    attributes:
      label: Browser, device, commit
      placeholder: "Chrome 142, Windows 11, main @ abc1234"
