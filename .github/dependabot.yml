# D21: keep dependencies, the Docker base image (Node: zlib, OpenSSL) and Actions patched.
version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule: { interval: weekly }
    groups:
      minor-and-patch:
        update-types: [ "minor", "patch" ]
    open-pull-requests-limit: 5
  - package-ecosystem: docker
    directory: "/apps/api"
    schedule: { interval: weekly }
  - package-ecosystem: github-actions
    directory: "/"
    schedule: { interval: weekly }
