# The web container (#13): the built SPA, plus /api and /health forwarded to the API.
server {
  listen 80;
  root /usr/share/nginx/html;

  # The API rejects uploads over 1 MiB with its own 413 envelope (D21); let a slightly larger
  # body through so the user sees that message, not nginx's HTML error page.
  client_max_body_size 2m;

  location /api/ {
    proxy_pass http://api:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  location /health/ {
    proxy_pass http://api:3000;
  }

  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # Client-side routes (/map, /upload, ...) all serve the app.
  location / {
    try_files $uri /index.html;
  }
}
